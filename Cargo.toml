[package]
name = "precision-zoom"
version = "0.2.0"
edition = "2024"
description = "Cursor-following magnifier overlay with crosshair support for Windows"
license = "MIT"
repository = "https://github.com/Lutxs/precision-zoom-tool-for-games"
publish = false

[dependencies]
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Magnification", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
